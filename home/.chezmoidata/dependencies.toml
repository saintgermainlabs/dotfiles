# Mise tool dependencies per dotfiles module.
# Rendered into ~/.config/mise/conf.d/dotfiles.toml when modules.mise is enabled
# and the owning module is active (respecting gui + requires_gui).
#
# tools.*     — mise [tools] entries (name = version; "latest" is fine)
# roles.<role> — extra tools only when host role matches (local | remote)
# requires_gui — skip this block when host gui = false (defaults false)
# system      — OS packages not installable via mise (documentation / provisioner)

[dependencies.mise]
description = "Baseline CLI stack for dotfiles (requires modules.mise)"

[dependencies.mise.tools]
ripgrep = "latest"
fzf = "latest"
fd = "latest"
bat = "latest"
eza = "latest"
zoxide = "latest"
bats = "latest"
7zip = "latest"

[dependencies.mise.roles.local]
lazygit = "latest"
lazydocker = "latest"
starship = "latest"

[dependencies.docker]
description = "Docker helpers module"

[dependencies.docker.roles.local]
lazydocker = "latest"

[dependencies.nautilus]
requires_gui = true
description = "Nautilus scripts (clipboard uses session-specific system packages)"

[dependencies.nautilus.system]
wl-clipboard = "Wayland clipboard (wl-paste / wl-copy)"
xclip = "X11 clipboard"

[dependencies.nautilus_extensions]
requires_gui = true
description = "ToFpon Nautilus Python extensions (PPA; see ~/.config/dotfiles/nautilus-extensions.toml)"

[dependencies.nautilus_extensions.system]
python3-nautilus = "Nautilus Python extension API"
python3-gi = "PyGObject"
gir1.2-gtk-4.0 = "GTK 4 introspection"
gir1.2-adw-1 = "Libadwaita introspection"
gir1.2-nautilus-4.0 = "Nautilus 4 introspection"
ghostscript = "PDF tools (optional extensions)"
ffmpeg = "Video/audio tools (optional extensions)"
p7zip-full = "Archive tools (extract-here, archive-browser)"
unrar = "RAR archives (extract-here)"
poppler-utils = "PDF utilities"
ripgrep = "Search content extension (also in mise when enabled)"
