# Environment variables exported on every `chezmoi apply`.
#
# Written to ~/.config/environment.d/90-chezmoi.conf (read by the systemd user
# manager at login) and pushed into the running session, so apps started from
# the desktop see them straight away. A terminal that is already open keeps its
# old environment; open a new one after applying.
#
# Example:
#   [env]
#   EDITOR = "nvim"
#   MY_PROJECTS = "/home/me/projects"
#
# CHEZMOI_HOME is not defined here: .bashrc and .zshrc set it from `chezmoi source-path`.

[env]
