# PATH entries managed by chezmoi. Rendered by ~/.chezmoitemplates/paths.tmpl
# into .bashrc/.zshrc.
#
# Sections:
#   prepend — prepended to PATH (highest priority, checked first)
#   common  — appended on every host (lowest priority)
#   local   — additionally appended when role = "local"
#   remote  — additionally appended when role = "remote"
#
# Edit, then run `chezmoi apply`.

[paths]

# Prepended to PATH (highest priority). Use sparingly.
prepend = [
  "/usr/bin",
  "~/bin",
  "~/.local/bin"
]

# Appended on every host.
common = []

# Appended only when role = "local".
local = [
  "/opt/Antigravity-x64/",
  "$HOME/.opencode/bin"
]

# Appended only when role = "remote".
remote = []
