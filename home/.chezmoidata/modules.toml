# Module switchboard — edit, then run `chezmoi apply`.
# requires_gui = true modules are forced off when the host has gui = false.

[modules.common]
enabled = true
description = "Shared shell aliases, functions, prompt"

[modules.git]
enabled = true
description = "Git config"

[modules.ssh]
enabled = true
description = "SSH client config"

[modules.gui]
enabled = true
requires_gui = true
description = "MIME defaults and other desktop config"

[modules.nautilus]
enabled = true
requires_gui = true
description = "Nautilus templates, config, and cfgnunes scripts"

[modules.nautilus_extensions]
enabled = true
requires_gui = true
description = "ToFpon Nautilus Python extensions (PPA manifest; provisioner installs)"

[modules.thunar]
enabled = false
requires_gui = true
description = "Thunar config (enable and disable nautilus if preferred)"

[modules.docker]
enabled = true
description = "Docker shell helpers under ~/.dotfiles/modules/docker"

[modules.hashicorp-vault]
enabled = false
description = "Vault CLI helpers under ~/.dotfiles/modules/hashicorp-vault"

[modules.mise]
enabled = true
description = "Additive mise tools via ~/.config/mise/conf.d/dotfiles.toml (never overwrites config.toml)"
